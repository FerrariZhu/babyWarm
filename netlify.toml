# Next.js app lives in warmrobot/web (npm workspaces monorepo).
# Install deps from warmrobot/, build the web workspace, deploy via OpenNext runtime.
[build]
  base = "warmrobot/web"
  command = "cd .. && npm ci && npm run build -w web"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Netlify is the public TLS edge. The stateful Next.js runtime stays beside
# PostgreSQL on the production host, so database credentials never enter
# Netlify Functions and PostgreSQL remains bound to localhost.
[[redirects]]
  from = "/*"
  to = "https://124.223.189.198/:splat"
  status = 200
  force = true
